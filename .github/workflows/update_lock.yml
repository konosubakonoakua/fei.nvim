name: update lockfile
on:
  # Weekly update (Mondays). Replaces the old "only after a commit" gate and the
  # direct auto-commit: updates now land as a PR so they can be reviewed.
  schedule: [{ cron: "30 01 * * 1" }]
  workflow_dispatch:

jobs:
  update-lockfile:
    if: github.repository_owner == 'konosubakonoakua'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: rhysd/action-setup-vim@v1
        with:
          version: stable
          neovim: true

      # Point the default config dir at the checked-out copy so that
      # `Lazy! update` writes lazy-lock.json straight into the workspace.
      # NOTE: do NOT run scripts/install.sh here - it installs the whole
      # toolchain (fonts, node, ...) which a lockfile update does not need.
      - name: Use the checked-out config
        run: |
          mkdir -p "$HOME/.config"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.config/nvim"

      - name: Update lazy-lock.json
        timeout-minutes: 10
        run: |
          nvim --headless "+Lazy! update" "+qa"
          cat lazy-lock.json

      - uses: peter-evans/create-pull-request@v6
        with:
          add-paths: lazy-lock.json
          commit-message: "chore: update lazy-lock"
          title: "chore: update lazy-lock"
          body: |
            Automated weekly `Lazy! update`.
          branch: chore/lazy-lock-update
          delete-branch: true
